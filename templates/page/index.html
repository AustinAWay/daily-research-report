<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Archivo Black";src:url(fonts/ArchivoBlack-Regular.ttf)}
@font-face{font-family:"Inter Tight";src:url(fonts/InterTight.ttf)}
@font-face{font-family:"DM Mono";font-weight:500;src:url(fonts/DMMono-Medium.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FFF6E8;color:#1A1A3A;font-family:'Inter Tight',sans-serif}
#gl,#post{position:absolute;left:0;top:0;width:1920px;height:1080px}
#post{visibility:hidden}
#ui{position:absolute;inset:0;overflow:hidden}
.lay{position:absolute;inset:0}
.a{position:absolute}
.h{font-family:'Archivo Black',sans-serif;letter-spacing:-.025em;line-height:.9;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.m{font-family:'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;font-weight:500}
.t{font-family:'Inter Tight',sans-serif}
.b{color:#2F6BFF}.r{color:#FF5A4E}.dim{color:rgba(26,26,58,.45)}
.card{position:absolute;background:#fff;border:3px solid #1A1A3A;border-radius:22px;box-shadow:0 18px 0 rgba(26,26,58,.08)}
.chip{position:absolute;padding:12px 26px;border-radius:999px;font-family:'DM Mono',monospace;font-weight:500;font-size:30px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
svg{position:absolute;overflow:visible}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:-50px;opacity:.075;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(90,60,20,.17) 100%)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbblur" stdDeviation="0 0"/></filter></svg>
<canvas id="gl" width="1920" height="1080"></canvas><canvas id="post" width="1920" height="1080"></canvas>
<div id="ui"></div><div id="vig"></div><div id="grain"></div><div id="flash"></div>
<script src="vendor/gsap.min.js"></script><script src="vendor/CustomEase.min.js"></script><script src="vendor/SplitText.min.js"></script><script src="vendor/MorphSVGPlugin.min.js"></script><script src="vendor/DrawSVGPlugin.min.js"></script>
<script>gsap.registerPlugin(CustomEase,SplitText,MorphSVGPlugin,DrawSVGPlugin);</script>
<!-- timing.js (word timings, written by scripts/build_vo.py) and episode.js (beats, sources, citations; written by scripts/episode.py) -->
<script src="timing.js"></script><script src="episode.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import {TL,loadTextures} from './engine.js';
// ?s=open,beats,end  renders only some scene modules (fast previews). Default: the episode's scene list.
const q=new URLSearchParams(location.search);
const mods=(q.get('s')||'all')==='all'?(window.EPISODE.scenes||['open','beats','end']):q.get('s').split(',');
window.IMG_BASE='img/';
await document.fonts.ready;
const M={};for(const m of mods)M[m]=await import('./scenes/'+m+'.js');
const tex=new Set();for(const m of mods)(M[m].textures?M[m].textures(window.EPISODE):[]).forEach(x=>tex.add(x));
await loadTextures([...tex]);
for(const m of mods)M[m].build(window.EPISODE);
window.seek(0);window.READY=true;
</script></body></html>
